<!DOCTYPE html>
<!-- Define que o documento usa HTML5 -->

<html lang="pt-BR">
    <!-- define o idioma como português do Brasil -->

    <head>
        <!-- Área de configurações da página -->

        <meta charset="UTF-8">
        <!-- Define codificação UTF-8 (permite acentos) -->

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Permite responsividade em dispositivos móveis -->

        <title>Exemplo de Layout</title>
        <!-- Título exibido na aba do navegador -->

        <link rel="stylesheet" href="css/styles.css">
        <!-- Conecta o arquivo CSS externo -->

    </head>

    <body>
        <!-- Conteúdo visível da página -->

        <div class="container">
            <!-- Div principal que agrupa todo o layout -->

            <aside class="menu-lateral">
                <!-- Barra lateral (menu lateral do site) -->

                <h2>Menu</h2>
                <!-- Título do menu -->

                <ul>
                    <!-- Lista não ordenada -->

                    <li>
                        <a href="#">Item 1</a>
                    </li>
                    <!-- Item do menu -->

                    <li>
                        <a href="#">Item 2</a>
                    </li>
                    <!-- Item do menu -->

                    <li>
                        <a href="#">Item 3</a>
                    </li>
                    <!-- Item do menu -->

                </ul>

            </aside>

            <header class="cabecalho">
                <!-- Cabeçalho principal da página -->

                <h1>Meu Site</h1>
                <!-- Título principal -->

                <button class="btn-animate">
                    Clique Aqui
                </button>
                <!-- Botão com classe para possível animação no CSS -->

            </header>

            <main class="principal">
                <!-- Área principal de conteúdo -->

                <div class="content-box">
                    Conteúdo 1
                </div>
                <!-- Caixa de conteúdo -->

                <div class="content-box">
                    Conteúdo 2
                </div>
                <!-- Caixa de conteúdo -->

                <div class="content-box">
                    Conteúdo 3
                </div>
                <!-- Caixa de conteúdo -->

            </main>

        </div>

    </body>

</html>
<!-- Fim do documento -->
